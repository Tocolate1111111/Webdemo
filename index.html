<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altare Web Farmer v6.2 (Offline)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
    font-family: Inter, sans-serif;
    background: linear-gradient(135deg,#f0f9ff,#e0f2fe,#bae6fd);
    min-height:100vh;
}
.glass{
    background:rgba(255,255,255,.8);
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,.08);
}
.console{
    background:#0f172a;
    color:#38bdf8;
    font-family:monospace;
    border-radius:12px;
}
</style>
</head>

<body class="p-6">

<div class="max-w-6xl mx-auto space-y-6">

<div class="glass p-5 flex justify-between items-center">
<div>
<h1 class="text-2xl font-bold text-sky-600">
Altare Web Farmer 
<span class="text-sm bg-sky-100 px-2 py-1 rounded">Offline Mode</span>
</h1>
<p class="text-sm text-slate-500">Chạy trực tiếp trên GitHub Pages</p>
</div>
<div id="clientId" class="text-xs font-mono text-slate-500"></div>
</div>

<div class="grid md:grid-cols-3 gap-6">

<div class="glass p-5">
<h2 class="font-bold mb-4 flex justify-between">
Thêm Tài Khoản
<span id="accCount" class="text-xs bg-sky-100 px-2 py-1 rounded">0/4</span>
</h2>

<form id="addForm" class="space-y-3">
<input id="identifier" required placeholder="Username"
class="w-full p-2 border rounded">

<input id="password" type="password" required placeholder="Password"
class="w-full p-2 border rounded">

<button class="w-full bg-sky-500 text-white py-2 rounded">
Bắt Đầu Farm
</button>
</form>
</div>

<div class="glass p-5 md:col-span-2">
<h2 class="font-bold mb-4">Danh Sách Tài Khoản</h2>
<div id="accList" class="space-y-2"></div>
</div>

</div>

<div class="console p-4 h-56 overflow-y-auto" id="consoleLog"></div>

</div>

<script>
const MAX_ACCOUNTS = 4;

function getClientId(){
let id = localStorage.getItem("altare_client_id");
if(!id){
id="client_"+Math.random().toString(36).substr(2,8);
localStorage.setItem("altare_client_id",id);
}
return id;
}

document.getElementById("clientId").innerText="Thiết bị: "+getClientId();

function getState(){
return JSON.parse(localStorage.getItem("altare_state"))||{
accounts:[],
logs:[]
};
}

function saveState(state){
localStorage.setItem("altare_state",JSON.stringify(state));
}

function log(message){
let state=getState();
state.logs.push(message);
saveState(state);
render();
}

function render(){
let state=getState();

document.getElementById("accCount").innerText=
state.accounts.length+"/"+MAX_ACCOUNTS;

let accList=document.getElementById("accList");
accList.innerHTML="";

if(state.accounts.length===0){
accList.innerHTML="<div class='text-slate-400 italic'>Chưa có tài khoản</div>";
}

state.accounts.forEach(acc=>{
let div=document.createElement("div");
div.className="flex justify-between bg-white p-3 rounded shadow";

div.innerHTML=`
<div>
<p class="font-semibold">${acc.identifier}</p>
<p class="text-xs text-slate-500">ID: ${acc.tenant_id}</p>
</div>
<div class="flex gap-2">
<button onclick="toggleFarm('${acc.tenant_id}')" 
class="text-xs bg-emerald-100 px-2 rounded">
${acc.running?"⏸ Dừng":"▶ Chạy"}
</button>
<button onclick="removeAcc('${acc.identifier}')"
class="text-xs bg-red-100 px-2 rounded">
Xóa
</button>
</div>
`;
accList.appendChild(div);
});

let consoleBox=document.getElementById("consoleLog");
consoleBox.innerHTML="";
state.logs.slice(-50).forEach(l=>{
let div=document.createElement("div");
div.textContent=l;
consoleBox.appendChild(div);
});
consoleBox.scrollTop=consoleBox.scrollHeight;
}

document.getElementById("addForm").addEventListener("submit",e=>{
e.preventDefault();

let state=getState();

if(state.accounts.length>=MAX_ACCOUNTS){
alert("Đã đạt tối đa 4 tài khoản");
return;
}

let identifier=document.getElementById("identifier").value;

state.accounts.push({
identifier:identifier,
tenant_id:Math.random().toString(36).substr(2,8),
running:true
});

saveState(state);
log("✅ Thêm tài khoản "+identifier);

e.target.reset();
});

function removeAcc(identifier){
let state=getState();
state.accounts=state.accounts.filter(a=>a.identifier!==identifier);
saveState(state);
log("🗑 Xóa "+identifier);
}

function toggleFarm(id){
let state=getState();
let acc=state.accounts.find(a=>a.tenant_id===id);
acc.running=!acc.running;
saveState(state);
log((acc.running?"▶ Bắt đầu ":"⏸ Dừng ")+acc.identifier);
}

render();
</script>

</body>
</html>
